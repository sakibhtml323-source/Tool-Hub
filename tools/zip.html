<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <div class="container nav">
      <a href="../index.html" class="back" aria-label="Back to home">← Tool Hub</a>
      <nav class="breadcrumb" style="font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem;">
        <a href="../index.html" style="color:var(--muted);text-decoration:none;">Home</a> &gt; ZIP Compressor
      </nav>
      <h1 style="font-size:1.15rem;font-weight:800;letter-spacing:-0.01em;">ZIP Compressor</h1>
      <div style="font-size:0.85rem;color:var(--muted);">Create a ZIP archive from files</div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container">
      <div class="tool-shell">
        <div class="field">
          <label for="zip-files">Select files (multiple allowed)</label>
          <input type="file" id="zip-files" multiple class="file-input" />
        </div>
        <div class="field">
          <label for="zip-name">ZIP file name</label>
          <input type="text" id="zip-name" value="archive.zip" />
        </div>
        <div class="btn-group">
          <button id="zip-create" class="btn btn-primary" type="button" disabled>Create ZIP</button>
          <button id="zip-download" class="btn btn-outline" type="button" disabled>Download</button>
        </div>

        <p class="howto">Choose one or more files to create a ZIP. Everything happens in your browser; nothing is sent to a server.</p>
        <div id="zip-alert" class="alert alert-info" role="status" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="#6366f1" stroke-width="2"/><path d="M12 8h.01M11 12h1v5h1" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span></span></div>

        <div id="zip-list" style="margin-top:1rem;color:var(--muted);font-size:0.85rem;"></div>
        <div class="download-area">
          <a id="zip-download-link" class="download-btn" style="display:none;">Download ZIP</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p style="color:var(--muted);font-size:0.8rem;text-align:center;">Client-side — data never leaves your browser.</p>
    </div>
