      <h1 style="font-size:1.15rem;font-weight:800;letter-spacing:-0.01em;">Base64 Encoder</h1>
      <div style="font-size:0.85rem;color:var(--muted);">Encode / decode text</div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container">
      <div class="tool-shell">
        <div class="field">
          <label for="b64-input">Enter text</label>
          <textarea id="b64-input" placeholder="e.g. Tool Hub"></textarea>
        </div>
        <div class="btn-group">
          <button id="b64-encode" class="btn btn-primary" type="button">Encode (Base64)</button>
          <button id="b64-decode" class="btn btn-outline" type="button">Decode (From Base64)</button>
          <button id="b64-copy" class="btn btn-ghost" type="button">Copy</button>
        </div>

        <p class="howto">Enter text, tap “Encode” or “Decode”, then copy the result. Base64 is only encoding, not encryption.</p>
        <div id="b64-alert" class="alert alert-info" role="status" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="#6366f1" stroke-width="2"/><path d="M12 8h.01M11 12h1v5h1" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span></span></div>

        <div class="output-box" id="b64-output" aria-live="polite">
          <div class="output-header">
            <span class="lbl">Result</span>
            <button id="b64-copy-btn" class="copy-btn" type="button">Copy</button>
          </div>
          <div id="b64-output-text">Output will appear here</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
