<body>
  <a href="#main" class="skip-link">মূল কন্টেন্টে যাও</a>

  <header>
    <div class="container nav">
      <a href="../index.html" class="back" aria-label="হোমে ফেরা">← Tool Hub</a>
      <nav class="breadcrumb" style="font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem;">
        <a href="../index.html" style="color:var(--muted);text-decoration:none;">হোম</a> &gt; QR Code জেনারেটর
      </nav>
      <h1 style="font-size:1.15rem;font-weight:800;letter-spacing:-0.01em;">QR Code জেনারেটর</h1>
      <div style="font-size:0.85rem;color:var(--muted);">টেক্সট/URL → কিউআর কোড</div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container">
      <div class="tool-shell">
        <div class="field">
          <label for="qr-text">টেক্সট বা URL লিখুন</label>
          <textarea id="qr-text" placeholder="যেমন: https://sakibhtml323-source.github.io/Tool-Hub/ অথবা যে কোনো টেক্সট"></textarea>
        </div>
        <div class="field">
          <label for="qr-size">আকার (পিক্সেল)</label>
          <input type="number" id="qr-size" value="300" min="100" max="1000" />
        </div>
        <div class="btn-group">
          <button id="qr-generate" class="btn btn-primary" type="button">কিউআর কোড তৈরি করুন</button>
          <button id="qr-download" class="btn btn-outline" type="button" disabled>পিএনজি ডাউনলোড করুন</button>
        </div>

        <p class="howto">টেক্সট বা URL লিখলে কিউআর কোড তৈরি হবে, তারপর PNG ডাউনলোড করুন।</p>
        <div id="qr-alert" class="alert alert-info" role="status" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="#6366f1" stroke-width="2"/><path d="M12 8h.01M11 12h1v5h1" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span></span></div>

        <div id="qr-output" style="margin-top:1.5rem;text-align:center;">
          <canvas id="qr-canvas" style="border:1px solid var(--border);border-radius:8px;background:#ffffff;display:none;max-width:100%;"></canvas>
          <div id="qr-placeholder" style="color:var(--muted);font-size:0.9rem;">আপনার কিউআর কোড এখানে দেখা যাবে</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p style="color:var(--muted);font-size:0.8rem;text-align:center;">ক্লায়েন্ট-সাইড — ডাটা ব্রাউজারের বাইরে যায় না।</p>
    </div>
  </footer>
