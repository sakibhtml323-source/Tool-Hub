<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <div class="container nav">
      <a href="../index.html" class="back" aria-label="Back to home">← Tool Hub</a>
      <nav class="breadcrumb" style="font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem;">
        <a href="../index.html" style="color:var(--muted);text-decoration:none;">Home</a> &gt; JSON Formatter
      </nav>
      <h1 style="font-size:1.15rem;font-weight:800;letter-spacing:-0.01em;">JSON Formatter</h1>
      <div style="font-size:0.85rem;color:var(--muted);">Format, minify and validate</div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container">
      <div class="tool-shell">
        <div class="field">
          <label for="json-input">Paste JSON text</label>
          <textarea id="json-input" placeholder='{"name": "Tool Hub", "version": 1}'></textarea>
        </div>
        <div class="btn-group">
          <button id="json-format" class="btn btn-primary" type="button">Format</button>
          <button id="json-minify" class="btn btn-outline" type="button">Minify</button>
          <button id="json-validate" class="btn btn-outline" type="button">Validate</button>
          <button id="json-copy" class="btn btn-ghost" type="button">Copy</button>
        </div>

        <p class="howto">Paste JSON, then format, minify or validate it. If there is an error, the reason will be shown.</p>
        <div id="json-alert" class="alert alert-info" role="status" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="#6366f1" stroke-width="2"/><path d="M12 8h.01M11 12h1v5h1" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span></span></div>

        <div class="output-box" id="json-output" aria-live="polite">
          <div class="output-header">
            <span class="lbl">Output</span>
            <button id="json-copy-btn" class="copy-btn" type="button">Copy</button>
          </div>
          <div id="json-output-text">Output will appear here</div>
        </div>
        <div id="json-download" class="download-area">
          <a id="json-download-link" class="download-btn" download="formatted.json" style="display:none;">Download JSON</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p style="color:var(--muted);font-size:0.8rem;text-align:center;">Client-side — data never leaves your browser.</p>
    </div>
  </footer>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "isPartOf": {
      "@type": "WebSite",

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/tool-json.js"></script>
