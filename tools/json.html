  <main id="main" class="tool-page">
    <div class="container">
      <div class="tool-shell">
        <div class="field">
          <label for="json-input">জেএসওএন টেক্সট পেস্ট করুন</label>
          <textarea id="json-input" placeholder='{"name": "Tool Hub", "version": 1}'></textarea>
        </div>
        <div class="btn-group">
          <button id="json-format" class="btn btn-primary" type="button">সাজানো (Format)</button>
          <button id="json-minify" class="btn btn-outline" type="button">মিনিফাই (Minify)</button>
          <button id="json-validate" class="btn btn-outline" type="button">যাচাই (Validate)</button>
          <button id="json-copy" class="btn btn-ghost" type="button">কপি</button>
        </div>

        <p class="howto">জেএসওএন পেস্ট করে সাজান, মিনিফাই বা যাচাই করুন। ত্রুটি থাকলে কারণ দেখানো হবে।</p>
        <div id="json-alert" class="alert alert-info" role="status" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="#6366f1" stroke-width="2"/><path d="M12 8h.01M11 12h1v5h1" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span></span></div>

        <div class="output-box" id="json-output" aria-live="polite">
          <div class="output-header">
            <span class="lbl">আউটপুট</span>
            <button id="json-copy-btn" class="copy-btn" type="button">কপি</button>
          </div>
          <div id="json-output-text">আউটপুট এখানে আসবে</div>
        </div>
        <div id="json-download" class="download-area">
          <a id="json-download-link" class="download-btn" download="formatted.json" style="display:none;">জেএসওএন ডাউনলোড করুন</a>
        </div>
      </div>
    </div>
  </main>
